<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seed Firestore</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    button { padding: 12px 24px; font-size: 16px; background: #c45c3b; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .5; }
    pre { background: #f4f0ea; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Seed Firestore</h1>
  <p>اضغطي الزر <b>مرة وحدة بس</b>. لو ضغطتي مرتين ما في مشكلة (بيكتب فوق نفس البيانات).</p>
  <button id="btn">Add data to Firestore</button>
  <pre id="log"></pre>

  <script type="module">
    import { db } from "./js/firebase.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const log = (m) => document.getElementById("log").textContent += m + "\n";

    const destinations = [
      { id: "petra", name: "Petra", nameAr: "البتراء", category: "history", location: "Ma'an Governorate", lat: 30.3285, lng: 35.4444, rating: 4.8, reviewCount: 2450, featured: true,
        description: "Carved into rose-red sandstone more than 2,000 years ago, Petra is Jordan's most iconic heritage site and a journey through Nabataean history.",
        bestTime: "March – May", entryFee: "JD 50 (included in JP)", duration: "Full Day (1-2 days rec.)", difficulty: "Moderate (Lots of walking)" },
      { id: "wadi-rum", name: "Wadi Rum", nameAr: "وادي رم", category: "adventure", location: "Aqaba Governorate", lat: 29.5321, lng: 35.4200, rating: 4.9, reviewCount: 1800, featured: true,
        description: "Mars-like desert landscapes, orange sand dunes, natural rock bridges, and starlit Bedouin camps.",
        bestTime: "March – May", entryFee: "JD 5", duration: "1-2 days", difficulty: "Easy to Moderate" },
      { id: "dead-sea", name: "Dead Sea", nameAr: "البحر الميت", category: "beaches", location: "Balqa Governorate", lat: 31.5590, lng: 35.4732, rating: 4.7, reviewCount: 1500, featured: true,
        description: "Float effortlessly in the lowest place on earth. Indulge in therapeutic mineral mud and beautiful seaside retreats.",
        bestTime: "October – April", entryFee: "Varies by resort", duration: "Half Day", difficulty: "Easy" },
      { id: "aqaba", name: "Aqaba", nameAr: "العقبة", category: "beaches", location: "Aqaba Governorate", lat: 29.5321, lng: 35.0063, rating: 4.7, reviewCount: 900, featured: true,
        description: "Red Sea diving and coastal relaxation with some of the best coral reefs in the region.",
        bestTime: "Year-round", entryFee: "Free", duration: "2-3 days", difficulty: "Easy" },
      { id: "jerash", name: "Jerash", nameAr: "جرش", category: "history", location: "Jerash Governorate", lat: 32.2747, lng: 35.8961, rating: 4.9, reviewCount: 1100, featured: true,
        description: "One of the best-preserved Roman provincial cities in the world, featuring paved avenues, theatres, and plazas.",
        bestTime: "March – May", entryFee: "JD 10", duration: "Half Day", difficulty: "Easy" },
      { id: "ajloun", name: "Ajloun", nameAr: "عجلون", category: "nature", location: "Ajloun Governorate", lat: 32.3326, lng: 35.7517, rating: 4.6, reviewCount: 600, featured: true,
        description: "Lush forests and a 12th-century hilltop castle with views across the Jordan Valley.",
        bestTime: "Spring / Autumn", entryFee: "JD 3", duration: "Half Day", difficulty: "Easy" },
      { id: "amman", name: "Amman", nameAr: "عمّان", category: "history", location: "Amman Governorate", lat: 31.9454, lng: 35.9284, rating: 4.6, reviewCount: 1300, featured: false,
        description: "The vibrant capital blending ancient and modern: the Citadel, the Roman Theatre, and lively food streets.",
        bestTime: "Spring / Autumn", entryFee: "Free", duration: "1-2 days", difficulty: "Easy" },
      { id: "dana", name: "Dana", nameAr: "دانا", category: "nature", location: "Tafilah Governorate", lat: 30.6800, lng: 35.6100, rating: 4.8, reviewCount: 500, featured: false,
        description: "Jordan's largest nature reserve with stunning hiking trails and a peaceful stone village.",
        bestTime: "March – May", entryFee: "JD 8", duration: "1-2 days", difficulty: "Moderate" }
    ];

    const experiences = [
      { id: "exp-dana-hiking", title: "Hiking in Dana Nature Reserve", category: "nature", location: "Dana Biosphere", rating: 4.9 },
      { id: "exp-rum-camping", title: "Camping Under the Stars in Wadi Rum", category: "adventure", location: "Wadi Rum", rating: 5.0 },
      { id: "exp-amman-food", title: "Local Food Tour in Amman", category: "food", location: "Amman", rating: 4.9 },
      { id: "exp-petra-night", title: "Exploring Petra by Night", category: "history", location: "Petra", rating: 4.8 },
      { id: "exp-aqaba-diving", title: "Diving in Aqaba", category: "adventure", location: "Aqaba Gulf", rating: 4.7 },
      { id: "exp-madaba-workshop", title: "Cultural Workshop in Madaba", category: "history", location: "Madaba", rating: 4.9 }
    ];

    const reviews = [
      { id: "rev-1", destinationId: "petra", destinationName: "Petra", userName: "Sarah M.", rating: 5, status: "approved", likes: 12,
        text: "Walking through the Siq and suddenly seeing the Treasury appear through the canyon is a moment I will never forget." },
      { id: "rev-2", destinationId: "petra", destinationName: "Petra", userName: "Ahmed K.", rating: 4, status: "approved", likes: 5,
        text: "Amazing but crowded. Go early in the morning to avoid the crowds." },
      { id: "rev-3", destinationId: "wadi-rum", destinationName: "Wadi Rum", userName: "Omar Mansour", rating: 4, status: "approved", likes: 8,
        text: "A beautiful night under the stars and warm Bedouin hospitality. Bring a light jacket." },
      { id: "rev-4", destinationId: "dead-sea", destinationName: "Dead Sea", userName: "Layla Nasser", rating: 5, status: "pending", likes: 0,
        text: "Peaceful views and an easy day trip from Amman. The sunset colors were incredible." },
      { id: "rev-5", destinationId: "ajloun", destinationName: "Ajloun Castle", userName: "Rana Darwish", rating: 5, status: "pending", likes: 0,
        text: "Green hills, wide views, and a fascinating castle. A refreshing side of Jordan." }
    ];

    async function seed(col, items) {
      for (const { id, ...data } of items) {
        await setDoc(doc(db, col, id), { ...data, image: `images/${id}.jpg`, createdAt: serverTimestamp() }, { merge: true });
        log(`✓ ${col}/${id}`);
      }
    }

    document.getElementById("btn").onclick = async (e) => {
      e.target.disabled = true;
      try {
        await seed("destinations", destinations);
        await seed("experiences", experiences);
        await seed("reviews", reviews);
        log("\nDone! افتحي Firestore Console وتأكدي.");
      } catch (err) {
        log("Error: " + err.message);
        e.target.disabled = false;
      }
    };
  </script>
</body>
</html>
